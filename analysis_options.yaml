include: package:lint/strict.yaml

analyzer:
  # plugins:
  #   - custom_lint  # blocked: custom_lint ^0.7.x needs analyzer >=7 which breaks build_runner ^2.4.x
  exclude:
    - "hiddify-core/**"
    - "**.g.dart"
    - "**.freezed.dart"
    - "**.mapper.dart"
    - "lib/gen/**"
    - "lib/hiddifycore/generated/**"
  errors:
    invalid_annotation_target: ignore

formatter:
  page_width: 120

linter:
  rules:
    sort_pub_dependencies: false
    sort_unnamed_constructors_first: false
    avoid_classes_with_only_static_members: false

custom_lint:
  rules:
    # Enable one rule
    - provider_parameters